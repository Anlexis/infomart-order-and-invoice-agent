[project]
name = "cmn-c2-286"
version = "0.1.0"
description = "InfomartOrderInvoiceAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is not resolvable from the default
# package index, so pinning it here would make `pip install -e .` fail. It is
# installed separately from the registry that publishes it.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The framework wheel ships no type information, so every symbol imported from
# it resolves to Any. Without this, subclassing a framework base class is an
# error on every line of every node.
disallow_subclassing_any = false
# The sample files under src/examples/ are reference material shipped alongside
# the agent, not part of it - they are read, not type-checked.
exclude = ["src/examples/"]

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The state module extends the framework's untyped AgentState, which resolves
# to Any, so every field declaration in the subclass is reported as an invalid
# type. There is one cause, not one per field.
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
